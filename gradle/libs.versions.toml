# ---------------------------------------------------------------------------
# Version catalog.
#
# Policy for this project: a dependency is only added when it removes more
# code / risk than it introduces. Everything the agent needs to *operate the
# phone* comes from the Android framework (AccessibilityService, gestures,
# WindowManager), not from third-party libraries.
#
# Current set (7 runtime deps, all first-party AndroidX/Kotlin):
#   coroutines-android : structured concurrency for the agent step loop
#   core-ktx           : ContextCompat / view helpers / API-level guards
#   appcompat          : DayNight theming + stable Activity base
#   material           : accessible components (buttons, chips) + theme
#   recyclerview       : chat transcript, node inspector, workflow list
#   lifecycle-runtime  : repeatOnLifecycle-safe Flow collection from UI
#   kotlin-stdlib      : language runtime
#
# Test-only: org.json (reference implementation) - see the note under [versions].
#
# Deliberately NOT included (see docs/DECISIONS.md):
#   Room/KSP      -> a JSON file store with atomic writes is enough for the
#                    data volumes here and removes a whole build-toolchain
#                    (KSP + Kotlin version coupling) from the critical path.
#   Compose       -> the overlay is a WindowManager view; Views+XML keeps the
#                    resident footprint and cold-start cost low on 4 GB devices.
#   ML Kit OCR    -> vision is Level 3/4 fallback only. Wired behind an
#                    interface (vision/OcrEngine.kt) and stays opt-in.
#   Retrofit/OkHttp -> no network in V1; no INTERNET permission declared.
# ---------------------------------------------------------------------------

[versions]
agp = "8.13.2"
kotlin = "2.2.20"
coroutines = "1.9.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
junit = "4.13.2"
coroutinesTest = "1.9.0"
# org.json ships inside android.jar as *stubs that throw* ("not mocked"), so JVM
# unit tests of the persistence layer need the real reference implementation.
# Test-only: at runtime the framework's own org.json is used and nothing is added
# to the APK.
json = "20240303"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
